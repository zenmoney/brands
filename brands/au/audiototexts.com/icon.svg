<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AudioToText">
  <!-- Sin fondo por defecto. En navegador oscuro aparece uno blanco detrás,
       porque el verde azulado sobre una pestaña oscura pierde contraste. Los
       favicon SVG admiten consultas de medios; los .ico y .png no, y por eso
       allí el fondo blanco va siempre. -->
  <style>
    .fondo { fill: none }
    @media (prefers-color-scheme: dark) { .fondo { fill: #ffffff } }
  </style>
  <rect class="fondo" width="32" height="32" rx="7"/>
  <!-- La A con la onda dentro, el mismo trazo que `brand/logo.tsx` escalado de
       una caja de 24 a una de 32 con 4 de margen: 24 → 24, y el grupo movido. -->
  <g transform="translate(4 4)" fill="none" stroke="#00746f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20.5 12 3.5l8 17" stroke-width="2.5"/>
    <path d="M8.6 15.2v1.6M12 13.8v4.4M15.4 15.2v1.6" stroke-width="2.2"/>
  </g>
</svg>
